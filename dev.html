<!doctype html>

<html>
	<head>
		<title>urlock</title>
		<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="initial-scale=1, user-scalable=no, maximum-scale=1, width=device-width, height=device-height" />
		<link rel="icon" type="image/x-icon" href="icon.png" />
		<link rel="stylesheet" href="css/urlock.css" />
		<script>
			const DEBUG = true;
		</script>
		<script src="js/polybase64.js"></script>
		<script src="js/urlock.js"></script>
	</head>

	<body>
		<main id="wrp">
			<header>
				<div id="urlock">urlock</div>
				<a href="https://github.com/nicopowa/urlock" target="_blank">
					<div id="git"></div>
				</a>
				<div id="spc"></div>
				<label id="lbl" for="fin">browse</label>
				<input type="file" id="fin" />
			</header>
			<input id="ttl" type="text" placeholder="title (not encrypted)" />
			<textarea id="txt" placeholder="type text or drop file" required></textarea>
			<div id="box">
				<div id="nnm"></div>
				<div id="siz"></div>
				<button id="act"></button>
			</div>
			<div id="row">
				<input id="pwd" type="text" placeholder="password" required autocapitalize="off" autocomplete="off" />
				<button id="btn"></button>
			</div>
		</main>
	</body>
</html>
