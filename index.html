<!doctype html>

<html>
	<head>
		<title>urlock</title>
		<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="initial-scale=1, user-scalable=no, maximum-scale=1, width=device-width, height=device-height" />
		<link rel="icon" type="image/png" href="icon.png" />
		<link rel="stylesheet" href="css/urlock.package.min.css" />
		<script src="js/urlock.package.release.min.js"></script>
	</head>

	<body>
		<main id="wrp" class="lck">
			<header>
				<div id="urlock">urlock</div>
				<div id="tit"></div>
				<a id="git" href="https://github.com/nicopowa/urlock" target="_blank"> </a>
			</header>

			<input id="ttl" type="text" placeholder="title (optional, not encrypted)" />
			<textarea id="txt" placeholder="text" required></textarea>

			<div id="box">
				<label id="lbl" for="fin">click to browse or drop files</label>
				<div id="bar">
					<input id="fin" type="file" />
					<div id="siz"></div>
					<button id="act"></button>
				</div>
				<div id="nnm"></div>
			</div>

			<div id="row">
				<div id="grp">
					<input id="pwd" type="text" placeholder="password" required autocapitalize="off" autocomplete="off" />
					<div id="psd">
						<div id="rev"></div>
						<div id="cwd"></div>
					</div>
				</div>
				<button id="btn"></button>
			</div>
		</main>
	</body>
</html>
